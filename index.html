<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神農會刊作品集</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: radial-gradient(ellipse at center, #3a3a3a 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            color: #e0d8c8;
        }
        header h1 {
            font-size: 20px;
            letter-spacing: 3px;
            font-weight: normal;
            margin-bottom: 4px;
        }
        header p {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }

        /* StPageFlip 掛載容器 */
        #flipbook {
            position: relative;
        }

        /* 每一頁內容 */
        .page {
            background: #f0ece4;
            overflow: hidden;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #f0ece4;
        }

        .page.blank {
            background: #f5f2ec;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 13px;
        }

        #page-info {
            margin-top: 16px;
            color: #888;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .hint {
            margin-top: 6px;
            color: #555;
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<header>
    <h1>中藥公會 神農會刊</h1>
    <p>作品集數位存檔</p>
</header>

<div id="flipbook"></div>

<div id="page-info"></div>
<p class="hint">← 點左側往回翻　點右側翻下一頁 →　｜　鍵盤 ← → 方向鍵</p>

<!-- StPageFlip（MIT 授權，可商用） -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
// ════════════════════════════════════════════
//  ★ 設定區：依序填入圖片路徑
//    第一張 = 封面（自動單頁居右）
//    其餘兩兩一組為跨頁
// ════════════════════════════════════════════
const images = [
    'files/1.jpg',
    'files/2.jpg',
    'files/3.jpg',
    'files/4.jpg',
    'files/5.jpg',
    'files/6.jpg',
    'files/7.jpg',
    'files/8.jpg',
    'files/9.jpg',
    'files/10.jpg',
    'files/11.jpg',
    // 繼續加入...
];

// ── 單頁尺寸 ──
const PAGE_W = 300;
const PAGE_H = 420;

// ════════════════════════════════════════════
//  建立頁面 DOM
// ════════════════════════════════════════════
const container = document.getElementById('flipbook');

images.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'page';
    const img = document.createElement('img');
    img.src = src;
    img.alt = `第 ${i + 1} 頁`;
    div.appendChild(img);
    container.appendChild(div);
});

// 奇數頁補空白，讓最後一頁有對頁
if (images.length % 2 !== 0) {
    const blank = document.createElement('div');
    blank.className = 'page blank';
    container.appendChild(blank);
}

// ════════════════════════════════════════════
//  初始化 StPageFlip
// ════════════════════════════════════════════
const pageFlip = new St.PageFlip(container, {
    width:  PAGE_W,
    height: PAGE_H,

    size: 'fixed',
    minWidth:  PAGE_W,
    maxWidth:  PAGE_W,
    minHeight: PAGE_H,
    maxHeight: PAGE_H,

    drawShadow:       true,   // 翻頁光影
    flippingTime:     800,    // 動畫時間 (ms)
    usePortrait:      false,  // 強制雙頁（不自動切單頁）
    startZIndex:      0,
    autoSize:         false,
    maxShadowOpacity: 0.6,
    showCover:        true,   // 封面單頁居右
    mobileScrollSupport: false,
    clickEventForward:   false,
    useMouseEvents:   true,
    swipeDistance:    30,
    showPageCorners:  true,   // 滑鼠移到角落時出現翻頁提示
    disableFlipByClick: false,
});

pageFlip.loadFromHTML(document.querySelectorAll('.page'));

// ── 頁碼更新 ──
const pageInfo = document.getElementById('page-info');

function updateInfo(index) {
    const total = pageFlip.getPageCount();
    if (index === 0) {
        pageInfo.textContent = `封面　共 ${images.length} 頁`;
    } else if (index >= total - 1) {
        pageInfo.textContent = `封底　共 ${images.length} 頁`;
    } else {
        pageInfo.textContent = `第 ${index} – ${index + 1} 頁　/ 共 ${images.length} 頁`;
    }
}

pageFlip.on('flip', (e) => updateInfo(e.data));
updateInfo(0);

// ── 點擊左右翻頁 ──
container.addEventListener('click', (e) => {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x > rect.width / 2) {
        pageFlip.flipNext();
    } else {
        pageFlip.flipPrev();
    }
});

// ── 鍵盤方向鍵 ──
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        pageFlip.flipNext();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        pageFlip.flipPrev();
    }
});
</script>
</body>
</html>
